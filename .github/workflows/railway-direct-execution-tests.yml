name: Railway direct execution tests

on:
  push:
    branches:
      - fix/railway-direct-execution
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_executor_queue_safety tests.test_runtime_switches -v
      - run: python -m compileall app
